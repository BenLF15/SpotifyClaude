<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0c0b" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Anmelden · Spotlfy</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body class="login-body">
  <div class="aurora" aria-hidden="true"></div>
  <main class="login-card reveal is-visible">
    <img src="/assets/icon.svg" alt="" class="login-logo" width="56" height="56" />
    <h1>Spotlfy</h1>
    <p class="muted">Dein persönliches Musik-Dashboard</p>
    <form method="post" action="/login" class="login-form">
      <label for="password" class="sr-only">Passwort</label>
      <input id="password" name="password" type="password" placeholder="Passwort" autocomplete="current-password" required autofocus />
      <button type="submit" class="btn btn-primary">Anmelden</button>
      <p id="error" class="login-error" role="alert" hidden></p>
    </form>
  </main>
  <script src="/assets/login.js"></script>
</body>
</html>
