<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0c0b" />
  <meta name="color-scheme" content="dark" />
  <meta name="robots" content="noindex, nofollow" />
  <!-- Web-App (Homescreen): Vollbild ohne Browserleiste -->
  <link rel="manifest" href="/assets/manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Spotlfy" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="stylesheet" href="/assets/styles.css?v=20261112e" />
</head>
<body class="login-body">
  <div class="aurora" aria-hidden="true"></div>
  <main class="login-card">
    <img src="/assets/icon.svg" alt="" class="login-logo" width="56" height="56" />
    <h1>Spotlfy</h1>
    <p class="muted">Deine persönliche Spotify-Statistik</p>

    <!-- Schritt 1: Auswahl -->
    <div class="auth-choice" id="auth-choice">
      <button type="button" class="btn btn-primary auth-choice-btn" data-mode="login">Anmelden</button>
      <button type="button" class="btn btn-ghost auth-choice-btn" data-mode="register" id="choice-register">Registrieren</button>
    </div>

    <!-- Schritt 2: Benutzername + Passwort -->
    <form class="login-form" id="auth-form" novalidate hidden>
      <div class="auth-form-head">
        <button type="button" class="auth-back" id="auth-back" aria-label="Zurück">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg>
        </button>
        <h2 id="auth-title">Anmelden</h2>
      </div>
      <label for="username" class="sr-only">Benutzername</label>
      <input id="username" name="username" type="text" placeholder="Benutzername" autocomplete="username"
             autocapitalize="none" spellcheck="false" maxlength="24" required />
      <label for="password" class="sr-only">Passwort</label>
      <input id="password" name="password" type="password" placeholder="Passwort" autocomplete="current-password" maxlength="200" required />
      <div id="register-extra" hidden>
        <label for="password2" class="sr-only">Passwort wiederholen</label>
        <input id="password2" name="password2" type="password" placeholder="Passwort wiederholen" autocomplete="new-password" maxlength="200" />
        <p class="login-hint">3–24 Zeichen (Buchstaben, Zahlen, _ . -) · Passwort mindestens 8 Zeichen</p>
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn">Anmelden</button>
      <p class="auth-switch" id="auth-switch"></p>
    </form>
    <p id="error" class="login-error" role="alert" hidden></p>

  </main>
  <script src="/assets/login.js?v=20261112e"></script>
</body>
</html>
