<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Spotlfy: glänzende grüne Kugel mit plastischem Equalizer -->
  <defs>
    <radialGradient id="ball" cx="34%" cy="26%" r="82%">
      <stop offset="0" stop-color="#9bffc4"/>
      <stop offset="0.28" stop-color="#3ff07f"/>
      <stop offset="0.68" stop-color="#16b552"/>
      <stop offset="1" stop-color="#086b2f"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#003314" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26352c"/>
      <stop offset="1" stop-color="#050907"/>
    </linearGradient>
    <linearGradient id="barHi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gloss" cx="50%" cy="0%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="barShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.9" dy="1.6" stdDeviation="0.9" flood-color="#023d17" flood-opacity="0.65"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="30.5" fill="url(#ball)"/>
  <circle cx="32" cy="32" r="29.8" fill="none" stroke="url(#rim)" stroke-width="1.2"/>
  <g filter="url(#barShadow)">
    <rect x="15" y="34" width="7" height="13" rx="3.5" fill="url(#bar)"/>
    <rect x="24.5" y="25" width="7" height="22" rx="3.5" fill="url(#bar)"/>
    <rect x="34" y="30" width="7" height="17" rx="3.5" fill="url(#bar)"/>
    <rect x="43.5" y="18" width="7" height="29" rx="3.5" fill="url(#bar)"/>
  </g>
  <g fill="url(#barHi)">
    <rect x="15.6" y="34.8" width="2.4" height="11.4" rx="1.2"/>
    <rect x="25.1" y="25.8" width="2.4" height="20.4" rx="1.2"/>
    <rect x="34.6" y="30.8" width="2.4" height="15.4" rx="1.2"/>
    <rect x="44.1" y="18.8" width="2.4" height="27.4" rx="1.2"/>
  </g>
  <ellipse cx="27" cy="13.5" rx="17" ry="8.5" fill="url(#gloss)" opacity="0.6"/>
</svg>
