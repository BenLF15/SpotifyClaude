# Render Blueprint (optional) – ein einziger Node-Web-Service + Postgres.
# Der Sync (alle 30 Min.) und der tägliche Top-Snapshot laufen IN der App selbst,
# ein separater Cron Job ist nicht nötig.
# Manuell geht es genauso: Build Command `npm install`, Start Command `npm start`.

databases:
  - name: spotify-stats-db
    # Free-Postgres wird von Render nach 30 Tagen gelöscht → für dauerhafte Historie basic-256mb.
    plan: free
    region: frankfurt
    databaseName: spotify_stats
    user: spotify_stats
    postgresMajorVersion: "16"

services:
  - type: web
    name: spotify-stats
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: spotify-stats-db
          property: connectionString
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: TIMEZONE
        value: Europe/Berlin
